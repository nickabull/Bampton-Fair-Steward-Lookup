<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f99418"><title>Bampton Fair | Steward Stall Lookup</title><style>
:root{color-scheme:light;font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#141414;background:#fff9f1}*{box-sizing:border-box}body{margin:0}.banner{background:#f99418;border-bottom:4px solid #111}.banner-inner{max-width:730px;margin:auto;display:flex;gap:18px;align-items:center;padding:14px 18px}.banner img{width:156px;height:auto;display:block}.banner h1{font-size:1.32rem;line-height:1.12;margin:0}.banner p{font-size:.78rem;margin:4px 0 0;font-weight:650}.wrap{max-width:730px;margin:auto;padding:18px 14px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;color:#51463d;font-size:.9rem}label{font-weight:750;display:block;margin-bottom:7px}.search{width:100%;border:2px solid #232323;border-radius:12px;padding:15px;font:inherit;font-size:18px;background:white;outline-offset:2px}#count{margin:14px 0;color:#574f45;font-size:.9rem}.card{background:white;border:1px solid #ebdfd0;border-left:5px solid #f99418;border-radius:11px;padding:14px 15px;margin-bottom:10px;box-shadow:0 3px 8px #3b26070d}.line{display:flex;gap:11px;align-items:center}.num{background:#151515;color:#fff;font-size:1rem;font-weight:850;padding:9px 11px;border-radius:7px;min-width:65px;text-align:center}.name{font-weight:800;font-size:1.1rem;line-height:1.24}.muted{font-size:.92rem;color:#574e45;margin:7px 0 0}.tag{display:inline-block;background:#ffeed6;padding:3px 7px;border-radius:5px;font-size:.83rem;font-weight:650;margin-top:8px}details{margin-top:11px}summary{cursor:pointer;color:#151515;font-weight:750;text-decoration:underline;text-underline-offset:3px;padding:8px 0}details img{max-width:100%;width:100%;border:1px solid #ddd;border-radius:8px;margin-top:7px}#empty{padding:20px;text-align:center;color:#634e35;background:white;border-radius:9px}.foot{border-top:1px solid #eadccd;margin-top:24px;padding-top:13px;color:#675c50;font-size:.78rem}button.clear{border:1px solid #d1b99c;background:white;border-radius:9px;padding:8px 10px;font-weight:bold;cursor:pointer}@media(max-width:450px){.banner img{width:117px}.banner h1{font-size:1.1rem}.banner-inner{gap:12px}.wrap{padding:15px 12px}}@media(prefers-reduced-motion:no-preference){.card{animation:show .15s ease-out}@keyframes show{from{opacity:.5}to{opacity:1}}}
</style></head><body><header class="banner"><div class="banner-inner"><img src="bampton-council-logo.png" alt="Bampton Town Council"><div><h1>FAIR STALL LOOKUP</h1><p>STEWARD EDITION · 29 OCTOBER 2026</p></div></div></header><main class="wrap"><div class="top"><span>Public stall information only</span><button class="clear" id="clear" type="button">Clear search</button></div><label for="search">Find a stall, trader, product or access route</label><input id="search" class="search" type="search" placeholder="Try 57, donuts or Brook Street" inputmode="search" autocomplete="off" autofocus><p id="count" role="status"></p><section id="results" aria-label="Stall lookup results"></section><p class="foot">Reference guide only. Numbers and locations reflect the final 28 October list. For emergencies, use the fair control-room radio procedures. No personal contact information or incident logs are held on this page.</p></main><script src="./steward-data.js"></script><script>
(()=>{'use strict';const records=window.STALLS||[],maps=window.STALL_MAPS||{},query=document.querySelector('#search'),results=document.querySelector('#results'),count=document.querySelector('#count');function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}function render(){const q=query.value.trim().toLocaleLowerCase();const chosen=records.filter(r=>!q||[r.number,r.name,r.selling,r.location,r.accessRoad,r.parkingLocation].some(s=>String(s||'').toLocaleLowerCase().includes(q))).sort((a,b)=>Number(a.number)-Number(b.number));results.replaceChildren();count.textContent=chosen.length+' matching stall entr'+(chosen.length===1?'y':'ies')+(q?'':' · 78 total');if(!chosen.length){results.append(el('p','', 'No matching stall found. Check the number or ask Control.'));return}for(const r of chosen){const card=el('article','card'),line=el('div','line');line.append(el('span','num','#'+r.number),el('span','name',r.name));card.append(line);if(r.selling)card.append(el('p','muted',r.selling));if(r.location)card.append(el('span','tag',r.location));if(r.accessRoad||r.parkingLocation){const access=el('p','muted');access.style.marginTop='10px';access.style.lineHeight='1.6';if(r.accessRoad)access.append(el('strong','', 'Entry road: '),document.createTextNode(r.accessRoad));if(r.parkingLocation){if(r.accessRoad)access.append(document.createElement('br'));access.append(el('strong','', 'Parking: '),document.createTextNode(r.parkingLocation));}card.append(access)}const related=Object.entries(maps).find(([area,m])=>m.stalls.some(n=>String(n).toLowerCase()===r.number.toLowerCase()));if(related){const d=el('details'),s=el('summary','', 'View '+related[0]+' map'),img=el('img');img.loading='lazy';img.src=related[1].file;img.alt=related[0]+' stall location map';d.append(s,img);card.append(d)}results.append(card)}}query.addEventListener('input',render);document.querySelector('#clear').addEventListener('click',()=>{query.value='';render();query.focus()});render()})();
</script></body></html>
